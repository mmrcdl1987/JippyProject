server:
  port: 8083
  forward-headers-strategy: framework
spring:
  application:
    name: notification

  datasource:
    url: "jdbc:postgresql://187.127.156.147:5434/n_db?options=-c timezone=Asia/Kolkata"
    username: n_user
    password: n_password
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:187.127.156.147:9092}
    consumer:
      group-id: notification-group
      # Starts reading from the beginning of the topic if no offset is found
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties: # CRITICAL: Tell Spring which Java packages are safe to deserialize
        spring.json.trusted.packages: "com.jippy.notification.dto"
        # Maps the incoming JSON back to your OrderEvent class
        spring.json.value.default.type: "com.jippy.notification.dto.NOrderEvent"
        spring.json.use.type.headers: false
    listener:
      ack-mode: record

    # Custom Firebase Path
#     app:
#      firebase:
#       config-path: classpath:jippy-firebase-key.json

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://eureka-admin:eureka-admin123@localhost:8070/eureka/

springdoc:
  api-docs: # Forces the microservice to expose its docs at /api/fm/v3/api-docs
    path: /api/notification/v3/api-docs