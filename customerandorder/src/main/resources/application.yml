server:
  port: 8082

spring:
  application:
    name: customerandorder

  datasource:
    url: jdbc:postgresql://187.127.156.147:5433/co_db
    username: co_user
    password: co_password
    driver-class-name: org.postgresql.Driver

    hikari:
      connection-test-query: SELECT 1
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      auto-commit: true
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      ddl-auto: none

    properties:
      hibernate:
        default_schema: jippy_customer_and_order
        format_sql: true

  cloud:
    openfeign:
      client:
        config:
          sms-country-client:
            connectTimeout: 5000
            readTimeout: 10000
            loggerLevel: basic

  kafka:
    bootstrap-servers: 187.127.156.147:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    properties:
      acks: all

    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring:
          json:
            trusted:
              packages: "com.jippy.customerandorder.dto"

  data:
    redis:
      #host: 187.127.156.147
      host: ${REDIS_HOST:jippy_redis}
      port: ${REDIS_PORT:6379}
      password: "${REDIS_PASSWORD:jippy-redis@574}"
      timeout: 6000ms


jwt:
  secret: ks93w6IjKBc8TckMt9xjYSj2rE8YHJvduMBJiXBytHk=
  expiration: 86400000

smscountry:
  auth-key: 7O7PgEmztmY5Nr70r0beANd
  auth-token: 1sTCN36yT5iYW2kfgkrV7qNyLC845mlpJzjlY8J1
  sender-id: JIPPYM
  base-url: https://restapi.smscountry.com/v0.1

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      probes:
        enabled: true

  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true

  tracing:
    sampling:
      probability: 1.0

  logging:
    level:
      root: WARN                                      # Silences all general framework info spams globally
      org.springframework: WARN                       # Limits core spring internal operational logs
      com.netflix.discovery: WARN                     # Silences all Netflix/Eureka endpoint fetching logs
      com.jippy.customerandorder: INFO                     # KEEP: Ensures your own custom application business logs are still visible
    # Forces Spring Boot to append [Service-Name, TraceId, SpanId] into standard logs out-of-the-box
    include-application-name: true

  level:
    root: INFO
    com.jippy.customerandorder: DEBUG

    org.springframework.transaction: DEBUG
    org.springframework.transaction.interceptor: TRACE
    org.springframework.orm.jpa: DEBUG
    org.springframework.data.transaction: TRACE

    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.engine.transaction: DEBUG

    com.zaxxer.hikari.HikariDataSource: DEBUG
    com.zaxxer.hikari.HikariConfig: DEBUG

eureka:
  instance:
    prefer-ip-address: true

  client:
    fetch-registry: true
    register-with-eureka: true

    service-url:
      defaultZone: http://eureka-admin:eureka-admin123@localhost:8070/eureka/

springdoc:
  api-docs:
    path: /api/co/v3/api-docs