server:
  port: 8082

jwt:
  secret: ks93w6IjKBc8TckMt9xjYSj2rE8YHJvduMBJiXBytHk=

spring:
  application:
    name: customerandorder

  datasource:
    url: jdbc:postgresql://187.127.156.147:5433/co_db
    username: co_user
    password: co_password
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
      ddl-auto: update
    show-sql: true

  #  Kafka Producer Configuration
  kafka:
    bootstrap-servers: 187.127.156.147:9092
    producer:
      # Serializes the Message Key (Order ID) as a String
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Serializes the OrderEvent object into a JSON string
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      # Ensures the message is acknowledged by Kafka brokers
      acks: all

    consumer:
      # Starts reading from the beginning of the topic if no offset is found
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # CRITICAL: Tell Spring which Java packages are safe to deserialize
        spring.json.trusted.packages: "com.jippy.customerandorder.dto"


  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0 # Capture 100% of traces for development. Reduce in production (e.g., 0.1).
    otlp:
      tracing:
        endpoint: http://localhost:4317 # The OTLP gRPC endpoint exposed by Grafana Tempo

  logging:
    level:
      root: WARN                                      # Silences all general framework info spams globally
      org.springframework: WARN                       # Limits core spring internal operational logs
      com.netflix.discovery: WARN                     # Silences all Netflix/Eureka endpoint fetching logs
      com.jippy.customerandorder: INFO                     # KEEP: Ensures your own custom application business logs are still visible
    # Forces Spring Boot to append [Service-Name, TraceId, SpanId] into standard logs out-of-the-box
    include-application-name: true



eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://eureka-admin:eureka-admin123@localhost:8070/eureka/

springdoc:
  api-docs:
    # Forces the microservice to expose its docs at /api/fm/v3/api-docs
    path: /api/co/v3/api-docs