server:
  port: 8082
spring:
  application:
    name: customerandorder
  datasource:
    url: jdbc:postgresql://187.127.156.147:5433/co_db
    username: co_user
    password: co_password
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
      ddl-auto: update
    show-sql: true

  #  Kafka Producer Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Serializes the Message Key (Order ID) as a String
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Serializes the OrderEvent object into a JSON string
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      # Ensures the message is acknowledged by Kafka brokers
      acks: all

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true



eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/